<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация</title>
    <style>
        body {
            margin: 0;
            background: #fff7ed;
            color: #292524;
            font-family: Arial, sans-serif;
        }
        nav {
            background: #ea580c;
            padding: 14px 30px;
            display: flex;
            align-items: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
        }
        .box {
            max-width: 350px;
            margin: 60px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            border: 1px solid #fed7aa;
            text-align: center;
        }
        input {
            width: 90%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #fdba74;
            border-radius: 5px;
        }
        button {
            width: 100%;
            background: #f97316;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #c2410c;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="logo">MobileMarket</a>
        <a href="/">Главная</a>
        <a href="/">Каталог</a>
        <a href="/cart">Корзина</a>
    </nav>

    <div class="box">
        <h2>Регистрация</h2>

        {error}

        <form action="/register" method="post">
            <input type="text" name="username" placeholder="Придумайте логин" required>
            <input type="password" name="password" placeholder="Придумайте пароль" required>
            <button type="submit">Создать аккаунт</button>
        </form>

        <p style="font-size: 14px; margin-top: 15px;">
            Есть аккаунт? <a href="/login" style="color: #ea580c;">Войти</a>
        </p>
    </div>

</body>
</html>
