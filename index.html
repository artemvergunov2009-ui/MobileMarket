<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MobileMarket</title>

    <style>
        body {
            margin: 0;
            background: #0d0d0d;
            color: white;
            font-family: Arial, sans-serif;
        }
        nav {
            background: #f97316;
            padding: 14px 30px;
            display: flex;
            align-items: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
        }
        .search {
            margin-left: auto;
        }
        input {
            padding: 8px;
            margin-right: 8px;
            border: none;
            border-radius: 5px;
        }
        button {
            background: #f97316;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #ea580c;
        }
        nav button {
            background: white;
            color: #f97316;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .categories {
            margin: 30px 0 10px 0;
        }
        .categories a {
            display: inline-block;
            background: #1a1a1a;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            margin: 0 6px 8px 0;
            border-radius: 20px;
        }
        .categories a:hover {
            background: #f97316;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .photo {
            background: white;
            border-radius: 8px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .photo img {
            max-width: 90%;
            max-height: 140px;
        }
        .card h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            height: 40px;
        }
        .price {
            color: #f97316;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">MobileMarket</a>
        <a href="index.html">Главная</a>
        <a href="#">Каталог</a>
        <a href="#">Корзина</a>

        <form class="search">
            <input type="search" placeholder="Поиск товаров">
            <button type="submit">Найти</button>
        </form>
    </nav>


    <div class="container">

        <div class="categories">
            <a href="#">Процессоры</a>
            <a href="#">Видеокарты</a>
            <a href="#">Материнские платы</a>
            <a href="#">Память</a>
            <a href="#">Накопители</a>
            <a href="#">Блоки питания</a>
            <a href="#">Периферия</a>
        </div>

        <h2>Популярные товары</h2>


        
        <div class="grid">
            <div class="card">
                <div class="photo">
                    <img src="https://ogo1.ru/upload/iblock/02c/hccwzl7vg21l879efdm1auzrbvuhb86q.jpeg" alt="AMD Ryzen 5 7600">
                </div>
                <h3>AMD Ryzen 5 7600</h3>
                <div class="price">15990 ₽</div>
                <button>В корзину</button>
            </div>

            <div class="card">
                <div class="photo">
                    <img src="https://avatars.mds.yandex.net/get-mpic/4453979/2a000001955a48992f3f876ea949f06500e5/orig" alt="NVIDIA GeForce RTX 4060">
                </div>
                <h3>NVIDIA GeForce RTX 4060</h3>
                <div class="price">31990 ₽</div>
                <button>В корзину</button>
            </div>


            <div class="card">
                <div class="photo">
                    <img src="https://avatars.mds.yandex.net/i?id=eec7532b654324a221d8aa2408a67dc67f8f669d-5887690-images-thumbs&n=13" alt="Kingston Fury 16GB DDR5">
                </div>
                <h3>Kingston Fury 16GB DDR5</h3>
                <div class="price">4990 ₽</div>
                <button>В корзину</button>
            </div>


            <div class="card">
                <div class="photo">
                    <img src="https://avatars.mds.yandex.net/get-mpic/18117352/2a0000019c751ec862a2c73cc3a9400b2b7e/orig" alt="Samsung 980 1TB NVMe">
                </div>
                <h3>Samsung 980 1TB NVMe</h3>
                <div class="price">6990 ₽</div>
                <button>В корзину</button>
            </div>
        </div>

    </div>




</body>
</html>
