<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MobileMarket</title>

    <style>
        body {
            margin: 0;
            background: #fff7ed;
            color: #292524;
            font-family: Arial, sans-serif;
        }
        nav {
            background: #ea580c;
            padding: 14px 30px;
            display: flex;
            align-items: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
        }
        .search {
            margin-left: auto;
        }
        input {
            padding: 8px;
            margin-right: 8px;
            border: 1px solid #fdba74;
            border-radius: 5px;
            background: #ffffff;
            color: #292524;
        }
        button {
            background: #f97316;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #c2410c;
        }
        nav button {
            background: #ffedd5;
            color: #c2410c;
            font-weight: bold;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .categories {
            margin: 30px 0 10px 0;
        }
        .categories a {
            display: inline-block;
            background: #ffedd5;
            color: #9a3412;
            text-decoration: none;
            padding: 8px 14px;
            margin: 0 6px 8px 0;
            border-radius: 20px;
        }
        .categories a:hover {
            background: #f97316;
            color: white;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .card {
            background: #ffffff;
            border: 1px solid #fed7aa;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .photo {
            background: #fffaf5;
            border-radius: 8px;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }
        .photo img {
            max-width: 90%;
            max-height: 140px;
        }
        .desc {
            color: #78716c;
            font-size: 13px;
            margin-bottom: 10px;
            height: 36px;
            overflow: hidden;
        }
        .card h3 {
            font-size: 16px;
            margin: 0 0 8px 0;
            height: 40px;
        }
        .price {
            color: #ea580c;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="logo">MobileMarket</a>
        <a href="/">Главная</a>
        <a href="/">Каталог</a>
        <a href="/cart">Корзина ({cart_count})</a>
        {auth_links}

        <form class="search" action="/" method="get">
            <input type="search" name="q" placeholder="Поиск товаров">
            <button type="submit">Найти</button>
        </form>
    </nav>

    <div class="container">

        <div class="categories">
            {categories}
        </div>

        <h2>Каталог товаров</h2>

        <div class="grid">
            {products}
        </div>

    </div>

</body>
</html>
