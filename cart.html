<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Корзина</title>

    <style>
        body {
            margin: 0;
            background: #fff7ed;
            color: #292524;
            font-family: Arial, sans-serif;
        }
        nav {
            background: #ea580c;
            padding: 14px 30px;
            display: flex;
            align-items: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
        }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #fed7aa;
            margin-bottom: 20px;
        }
        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #ffedd5;
        }
        th {
            background: #ffedd5;
            color: #9a3412;
        }
        button {
            background: #f97316;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-delete {
            background: #ef4444;
        }
        .btn-delete:hover {
            background: #b91c1c;
        }
        .total {
            font-size: 22px;
            font-weight: bold;
            color: #ea580c;
            margin-bottom: 20px;
        }
        .btn-order {
            display: inline-block;
            background: #ea580c;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="logo">MobileMarket</a>
        <a href="/">Главная</a>
        <a href="/">Каталог</a>
        <a href="/cart">Корзина ({cart_count})</a>
        {auth_links}
    </nav>

    <div class="container">
        <h2>Корзина</h2>
        {cart_content}
    </div>

</body>
</html>
